name: Build and Publish Beta

on:
  push:
    branches: [beta]
    paths:
      - 'Integrations/ESPHome/**'
      # A push that only changes this file must rebuild too
      - '.github/workflows/build-beta.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  beta:
    permissions:
      contents: write
    uses: ApolloAutomation/Workflows/.github/workflows/build-beta.yml@main
    with:
      # Devices fetch beta-fw/manifest-standard.json (ota_beta_manifest in PUMP-1.yaml)
      variants: >-
        [{"key": "standard", "yaml": "Integrations/ESPHome/PUMP-1.yaml", "name": "firmware-standard"}]
