substitutions:
  name: apollo-pump-1
  version: "26.8.27.1"
  device_description: ${name} made by Apollo Automation - version ${version}.
  # Default update channel on first boot (no stored user choice yet, i.e. a
  # fresh flash). The beta-channel builds override this to "Beta" (see
  # Integrations/ESPHome/beta-channel/) so firmware obtained from the beta
  # channel keeps tracking it instead of offering a stable "downgrade".
  firmware_channel_default: "Stable"
  # Manifest URL bases. Stable = GitHub Pages (main branch builds).
  # Beta = rolling "beta-fw" pre-release assets (beta branch builds).
  stable_manifest_base: "https://apolloautomation.github.io/PUMP-1"
  beta_manifest_base: "https://github.com/ApolloAutomation/PUMP-1/releases/download/beta-fw"
  # OTA manifest URLs picked by apply_ota_source.
  ota_stable_manifest: "${stable_manifest_base}/firmware/manifest.json"
  ota_beta_manifest: "${beta_manifest_base}/manifest.json"

esp32:
  variant: esp32c6
  flash_size: 8MB
  framework:
    type: esp-idf

esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    continuous: true

bluetooth_proxy:
    
esphome:
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            id(pump_start_time) = 0;
            id(safety_alert_active) = false;
        - script.execute: pump_safety_check
    - priority: -20
      then:
        - if:
            condition:
              switch.is_on: tank_refill_mode
            then:
              - switch.turn_on: stop_pump_when_full
              - switch.turn_off: stop_pump_when_dry
              - switch.turn_on: auto_refill
            else:
              - switch.turn_off: stop_pump_when_full
              - switch.turn_on: stop_pump_when_dry
              - switch.turn_off: auto_refill
    # Point the update entity at the selected channel's manifest.
    - priority: -100
      then:
        - script.execute: apply_ota_source
    # Re-apply the Bluetooth Proxy switch after all components set up, so BLE
    # scanning matches the persisted switch (proxy stays off by default).
    - priority: -300
      then:
        - if:
            condition:
              switch.is_on: bluetooth_proxy_switch
            then:
              - esp32_ble_tracker.start_scan:
                  continuous: true
            else:
              - esp32_ble_tracker.stop_scan:
    - priority: -100
      then:
        - delay: 1000ms
        - script.execute: statusCheck
    - priority: -10
      then:
        - if:
            condition:
              - lambda: "return id(runTest);"
            then:
              - lambda: "id(testScript).execute();"

api:
  encryption:
  actions:
    - action: play_buzzer
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song_str;'
    - action: run_pump_for_seconds
      variables:
        seconds: int
      then:
        - switch.turn_on: pump_control
        - delay: !lambda 'return seconds * 1000;'
        - switch.turn_off: pump_control
    - action: run_pump_until_full
      then: 
        - script.execute: pumpUntilFull

globals:
  - id: pump_start_time
    restore_value: no
    type: uint32_t
    initial_value: '0'
  - id: safety_alert_active
    restore_value: no
    type: bool
    initial_value: 'false'
  - id: runTest
    restore_value: yes
    type: bool
    initial_value: "true"
  - id: testCycleCount
    type: int

captive_portal:

web_server:
  port: 80
  version: 3

http_request:
  verify_ssl: true
  # GitHub release-asset downloads answer with a redirect carrying a
  # ~3.6 KB Content-Security-Policy header; each header line must fit
  # this buffer or the request fails with "HTTP_CLIENT: Out of buffer".
  buffer_size_rx: 5120
  # The redirect target is a signed URL with a ~850-char query string; the
  # follow-up request line must fit the TX buffer or esp_http_client_open
  # fails with "Out of buffer" before sending anything.
  buffer_size_tx: 2048

# Buzzer
output:
  - platform: ledc
    pin: GPIO5
    id: buzzer
rtttl:
 output: buzzer

button:
  - platform: restart
    icon: mdi:power-cycle
    name: "ESP Reboot"

  - platform: template
    name: "Firmware Update"
    id: update_firmware
    icon: mdi:cloud-download
    entity_category: "config"
    on_press:
      - logger.log: "Applying firmware update for the selected channel"
      - delay: 3s
      - script.execute: apply_ota_source
      - script.wait: apply_ota_source
      # The manifest fetch runs in its own task; give it a fixed window to land
      # (update.is_available stays false for same-version switches).
      - delay: 5s
      - lambda: id(update_http_request).perform(true);

  - platform: factory_reset
    disabled_by_default: True
    name: "Factory Reset ESP"
    id: factory_reset_all
  
  - platform: template
    name: "Run Pump"
    id: run_pump_button
    icon: mdi:pump
    on_press:
      then:
        - switch.turn_on: pump_control
        - delay: !lambda 'return (int)id(pump_run_seconds).state * 1000;'
        - switch.turn_off: pump_control
      
  - platform: template
    name: "Run Pump Until Output Wet"
    id: run_pump_until_out_wet
    icon: mdi:pump
    disabled_by_default: true
    on_press: 
      then:
        script.execute: pumpUntilFull


switch:
  - platform: factory_reset
    id: factory_reset_switch
    internal: true
    icon: mdi:shield-off
  - platform: template
    name: "Stop Pump When Output Wet"
    id: stop_pump_when_full
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:water-sync
    entity_category: config
  - platform: template
    name: "Stop Pump When Input Dry"
    id: stop_pump_when_dry
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:water-sync
    entity_category: config
  - platform: template
    name: "Tank Refill Mode"
    id: tank_refill_mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:water-sync
    entity_category: config
    on_turn_on:
      then:
        - switch.turn_on: stop_pump_when_full
        - switch.turn_off: stop_pump_when_dry
        - switch.turn_on: auto_refill
    on_turn_off:
      then:
        - switch.turn_off: stop_pump_when_full
        - switch.turn_on: stop_pump_when_dry
        - switch.turn_off: auto_refill
  - platform: template
    name: "Auto Refill"
    id: auto_refill
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:autorenew
    entity_category: config
  - platform: template
    name: "Pump Safety Override"
    id: pump_safety_override
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:shield-alert-outline
    disabled_by_default: true

  - platform: gpio
    pin: GPIO7
    name: "Pump Control"
    id: pump_control
    entity_category: config
    disabled_by_default: true
    on_turn_on:
      then:
        - if:
            condition:
              or:
                # Normal mode: input has water
                - and:
                    - switch.is_off: tank_refill_mode
                    - binary_sensor.is_on: fluid_input_sensor
                # Inverted mode: input is dry (destination is low, needs filling)
                - and:
                    - switch.is_on: tank_refill_mode
                    - binary_sensor.is_off: fluid_input_sensor
                # Bypass: dry protection not enabled
                - switch.is_off: stop_pump_when_dry
            then:
              - logger.log: "Pump turning on - conditions met"
              - text_sensor.template.publish:
                  id: last_pump_action
                  state: "Pump Started"
              - lambda: |-
                  id(pump_start_time) = millis();
                  id(safety_alert_active) = false;
              - script.execute: pump_safety_check
            else:
              - logger.log: "Pump blocked - water conditions not met"
              - switch.turn_off: pump_control
    on_turn_off:
      then:
        - if:
            condition:
              lambda: 'return id(pump_start_time) != 0;'
            then:
              - logger.log: "Pump turned off"
              - text_sensor.template.publish:
                  id: last_pump_action
                  state: "Pump Stopped"
        - lambda: |-
            id(pump_start_time) = 0;
            id(safety_alert_active) = false;

  - platform: template
    name: "Bluetooth Proxy"
    id: bluetooth_proxy_switch
    icon: mdi:bluetooth
    entity_category: "config"
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - esp32_ble_tracker.start_scan:
          continuous: true
    on_turn_off:
      - esp32_ble_tracker.stop_scan:

binary_sensor:
  - platform: status
    name: Online
    id: ink_ha_connected
  - platform: gpio
    id: reset_button
    pin: 
      number: GPIO9
      inverted: true
      mode:
        input: true
        pullup: true
      ignore_strapping_warning: true
    on_multi_click:
      - timing:
          - ON for at least 10s
        then:
          - button.press: factory_reset_all
      - timing:
          - ON for at least 3s
          - OFF for at least 0.2s
        then:
          - script.execute: statusCheck
          - delay: 3s
          - globals.set:
              id: testCycleCount
              value: "0"
          - globals.set:
              id: runTest
              value: "true"
          - script.execute: testScript
      - timing:
          - ON for at most 1s
          - OFF for at least 0.2s
        then:
          - script.execute: run_pump_timed

  - platform: gpio
    name: Fluid Input
    id: fluid_input_sensor
    icon: mdi:water
    device_class: moisture
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
      inverted: true
    on_release:
      then:
        - if:
            condition:
              and:
                - switch.is_on: auto_refill
                - switch.is_on: tank_refill_mode
                - switch.is_off: pump_control
            then:
              - logger.log: "Auto refill triggered - tank level low"
              - text_sensor.template.publish:
                  id: last_pump_action
                  state: "Auto Refill Triggered"
              - script.execute: pumpUntilFull

  - platform: gpio
    name: Fluid Output
    id: fulid_output_sensor
    icon: mdi:water
    device_class: moisture
    pin:
      number: GPIO14
      mode:
        input: true
        pullup: true
      inverted: true

number:
  - platform: template
    name: "Pump Run Seconds"
    id: pump_run_seconds
    icon: mdi:timer
    optimistic: true
    min_value: 1
    max_value: 120
    step: 1
    initial_value: 10
    unit_of_measurement: "s"
    restore_value: true
    mode: box
  - platform: template
    name: "Max Safe Run Time"
    id: max_safe_run_time
    entity_category: config
    icon: mdi:timer-alert
    optimistic: true
    min_value: 5
    max_value: 600
    step: 10
    initial_value: 60
    unit_of_measurement: "s"
    restore_value: true
    mode: box

sensor:
  - platform: internal_temperature
    name: "ESP Temperature"
    id: sys_esp_temperature
    disabled_by_default: true

  - platform: uptime
    name: Uptime
    id: sys_uptime
    update_interval: 60s

  - platform: wifi_signal
    name: RSSI
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

light:
  - platform: esp32_rmt_led_strip
    id: rgb_light
    name: "RGB Light"
    pin: GPIO3
    default_transition_length: 0s
    chipset: WS2812
    num_leds: 1
    channel_colors: GRB
    # Add explicit power supply limit to prevent current spikes
    max_refresh_rate: 20ms
    effects:
      - pulse:
          name: "Slow Pulse"
          transition_length: 1000ms
          update_interval: 1000ms
          min_brightness: 0%
          max_brightness: 100%
      - pulse:
          name: "Fast Pulse"
          transition_length: 100ms
          update_interval: 100ms
          min_brightness: 50%
          max_brightness: 100%

text_sensor:
  - platform: template
    name: "Last Pump Action"
    id: last_pump_action
    icon: mdi:pump
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip
      entity_category: "diagnostic"
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
    entity_category: "diagnostic"
  - platform: template
    name: "Apollo Firmware Version"
    id: apollo_firmware_version
    update_interval: never
    entity_category: "diagnostic"

select:
  - platform: template
    name: "Firmware Channel"
    id: firmware_channel
    icon: mdi:source-branch
    entity_category: "config"
    optimistic: true
    restore_value: true
    options:
      - "Stable"
      - "Beta"
    initial_option: "${firmware_channel_default}"
    on_value:
      then:
        - script.execute: apply_ota_source

script:
  - id: apply_ota_source
    # Sets the OTA manifest URL from the Firmware Channel select (Stable/Beta).
    then:
      - lambda: |-
          const bool beta = id(firmware_channel).current_option() == "Beta";
          std::string url = beta ? "${ota_beta_manifest}" : "${ota_stable_manifest}";
          ESP_LOGI("firmware", "OTA manifest set to: %s", url.c_str());
          id(update_http_request).set_source_url(url);
      - component.update: update_http_request

  - id: pumpUntilFull
    then:
      - switch.turn_on: stop_pump_when_full
      - delay: 100ms  # Small delay to ensure switch state is updated
      - switch.turn_on: pump_control
      
  - id: statusCheck
    then:
      - if:
          condition:
            - lambda: 'return id(ink_ha_connected).state;'
          then:
            - logger.log: "Apollo Automation: Connected To HA"
            - light.turn_on: 
                id: rgb_light
                brightness: 100%
                red: 0%
                green: 0%
                blue: 100%
          else:
            - if:
                condition:
                  - wifi.connected
                then:
                  - logger.log: "Apollo Automation: Connected To Wifi"
                  - light.turn_on: 
                      id: rgb_light
                      brightness: 100%
                      red: 0%
                      green: 100%
                      blue: 0%
                else:
                  - logger.log: "Apollo Automation: Not Connected To Wifi"
                  - light.turn_on: 
                      id: rgb_light
                      brightness: 100%
                      red: 100%
                      green: 100%
                      blue: 0%
      - delay: 5s
      - light.turn_off: rgb_light
  - id: run_pump_timed
    then:
      - switch.turn_on: pump_control
      - delay: !lambda 'return (int)id(pump_run_seconds).state * 1000;'
      - switch.turn_off: pump_control
  - id: pump_safety_check
    mode: restart
    then:
      - while:
          condition:
            - switch.is_on: pump_control
          then:
            - if:
                condition:
                  - and:
                      - switch.is_on: stop_pump_when_full
                      - binary_sensor.is_on: fulid_output_sensor
                then:
                  - logger.log: "Pump stopping - tank full"
                  - switch.turn_off: pump_control
            - if:
                condition:
                  - lambda: |-
                      if (id(pump_start_time) == 0) return false;
                      uint32_t runtime = (millis() - id(pump_start_time)) / 1000;
                      return runtime > id(max_safe_run_time).state && !id(pump_safety_override).state;
                then:
                  - logger.log: "Pump stopping - safety"
                  - switch.turn_off: pump_control
            - if:
                condition:
                  - and:
                      - switch.is_on: tank_refill_mode
                      - switch.is_off: stop_pump_when_full
                      - binary_sensor.is_on: fluid_input_sensor
                then:
                  - logger.log: "Pump stopping - destination full (inverted mode)"
                  - switch.turn_off: pump_control
            - if:
                condition:
                  - and:
                      - switch.is_on: stop_pump_when_dry
                      - switch.is_off: tank_refill_mode
                      - binary_sensor.is_off: fluid_input_sensor
                then:
                  - logger.log: "Pump stopping - input dry"
                  - switch.turn_off: pump_control
            - delay: 1s
  - id: testScript
    then:
      if: 
        condition:
          - lambda: "return id(runTest) == true;"
        then:
          - lambda: "id(runTest) = false;"
          - lambda: "id(testCycleCount) = 0;"
          - lambda: "id(runTest) = false;"
          - light.turn_on:
              id: rgb_light
              red: 0%
              green: 100%
              blue: 0%
          - delay: 5s
          - light.turn_on:
              id: rgb_light
              red: 0%
              green: 0%
              blue: 0%
          - light.turn_off:
              id: rgb_light
